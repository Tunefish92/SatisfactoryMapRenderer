name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # "Run workflow" in the Actions tab: on main it refreshes the Docker Hub description, on a
  # release tag it republishes that release's image. On other branches it only builds and tests.
  workflow_dispatch:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SatisfactoryMapRenderer.slnx

      - name: Build
        run: dotnet build SatisfactoryMapRenderer.slnx --no-restore -c Release

      # The tests build their own synthetic save files; the tests against real saves skip themselves.
      - name: Test
        run: dotnet test --solution SatisfactoryMapRenderer.slnx --no-build -c Release

  docker-build:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Build image (not pushed)
        run: docker build -f src/SatisfactoryMapRenderer/Dockerfile -t satisfactory-map-renderer:ci .

      # Starts the image with a root-owned data folder (what Docker creates for a missing bind
      # mount) and checks that the entrypoint hands it to the app user, the app comes up, visitors
      # are kept out of the save game source and an admin can log in.
      - name: Smoke test
        run: |
          if docker run --rm satisfactory-map-renderer:ci; then echo "started without an admin password"; exit 1; fi

          sudo mkdir -p /tmp/map-data
          docker run -d --name map -p 8080:8080 -e SMR_ADMIN_PASSWORD=ci-smoke-test -e SMR_MAX_ZOOM=4 -v /tmp/map-data:/data satisfactory-map-renderer:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          test "$(stat -c '%u:%g' /tmp/map-data)" = "1000:1000"
          test -f /tmp/map-data/map/index.html
          docker top map -eo pid,uid,args | grep -Eq '^\s*[0-9]+\s+1000\s+dotnet /app/SatisfactoryMapRenderer\.dll'
          curl -fsS http://localhost:8080/ | grep -q 'id="map"'
          # The bundled game data is found: the map has the game's logo out of the box.
          docker logs map 2>&1 | grep -q 'Game assets from /app/gamedata'
          curl -fsS -o /dev/null http://localhost:8080/game-logo.png

          curl -fsS http://localhost:8080/api/source | grep -q '"admin":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Map-Renderer: 1' -d x 'http://localhost:8080/api/upload?name=a.sav')" = "401"
          curl -fsS -X POST -H 'X-Map-Renderer: 1' -d '{"password":"ci-smoke-test"}' http://localhost:8080/api/login | grep -q '"admin":true'

      - name: Container logs
        if: always()
        run: docker logs map || true

  docker-publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional second registry: set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only releases are published: tag v1.2.3 → 1.2.3 and latest (pre-releases like v1.3.0-beta
      # don't move latest). Pushes to main only refresh the Docker Hub description below.
      - name: Image tags
        id: meta
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/satisfactorymaprenderer', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SatisfactoryMapRenderer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub's overview and short description, from docs/dockerhub.md. Editing them needs a
      # DOCKERHUB_TOKEN with the "Read, Write, Delete" scope.
      - name: Update Docker Hub description
        if: vars.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/satisfactorymaprenderer
          readme-filepath: ./docs/dockerhub.md
          short-description: Self-hosted interactive map of your Satisfactory save game or running dedicated server.
