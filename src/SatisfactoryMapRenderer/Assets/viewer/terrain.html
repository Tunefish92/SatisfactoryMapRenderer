<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <title>Satisfactory Map – 3D</title>
  <link rel="stylesheet" href="viewer.css">
  <script>
    try { const t = JSON.parse(localStorage.getItem('smr:theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* storage unavailable */ }
  </script>
</head>
<body class="terrain-page">
  <canvas id="terrain"></canvas>

  <div id="terrain-bar">
    <a class="terrain-back" href="index.html" title="Back to the map">←<span>Map</span></a>
    <img class="logo" src="logo.svg" width="26" height="26" alt="">
    <strong id="terrain-title">Satisfactory Map</strong>
    <span class="pill">3D</span>
  </div>

  <div id="terrain-panel" class="card">
    <label class="terrain-slider">
      <span>Height <output id="exaggeration-value">1.0×</output></span>
      <input type="range" id="exaggeration" min="0.5" max="3" step="0.1" value="1">
    </label>
    <div id="factory-layers"></div>
    <label class="option" id="opt-factory-row"><input type="checkbox" id="opt-factory" checked> Factory (painted on the ground)</label>
    <label class="option"><input type="checkbox" id="opt-markers" checked> Players &amp; landmarks</label>
    <label class="option"><input type="checkbox" id="opt-spin"> Rotate slowly</label>
    <button type="button" id="terrain-reset">Reset view</button>
    <p class="hint">Drag to rotate · right-drag or Shift+drag to move · wheel to zoom</p>
  </div>

  <div id="terrain-labels"></div>
  <div id="terrain-status" class="source-status" role="status">Loading the terrain…</div>

  <script src="map-data.js"></script>
  <script src="terrain/factory.js"></script>
  <script src="terrain.js"></script>
</body>
</html>
