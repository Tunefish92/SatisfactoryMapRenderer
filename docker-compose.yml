services:
  map:
    # `docker compose pull` fetches the prebuilt image; `docker compose up -d --build` builds it
    # from this checkout instead.
    image: ${SMR_IMAGE:-ghcr.io/tunefish92/satisfactorymaprenderer:latest}
    build:
      context: .
      dockerfile: src/SatisfactoryMapRenderer/Dockerfile
    container_name: satisfactory-map
    restart: unless-stopped
    # The admin password comes from admin.env, which is passed on exactly as written ("raw"):
    # every character is allowed, also "$", "#", quotes and spaces, which Compose would change in
    # .env or in this file. Without it the container stops with a message (`docker compose logs`).
    # Needs Docker Compose 2.30 or newer.
    env_file:
      - path: admin.env
        required: false
        format: raw
    environment:
      # Highest rendered zoom level (3-9). 9 is the sharpest; each level less renders about four
      # times faster and needs a quarter of the disk space.
      SMR_MAX_ZOOM: ${SMR_MAX_ZOOM:-9}
      # Owner of the data folder on the host; the app runs as this user.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "${SMR_PORT:-8080}:8080"
    volumes:
      - ${SMR_DATA_HOST_PATH:-./map-data}:/data
      # Optional, normally not needed: your Satisfactory installation, read-only. The image brings
      # the game's icons, names and in-game map; mount the game only when it is newer than those
      # (new items show without icons). They are then exported once into the data folder.
      # - /path/to/Satisfactory:/game:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
